services:
    app:
        depends_on:
            database:
                condition: service_healthy

    database:
        image: mysql:8
        container_name: laravel_database
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel_network
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--user=${DB_USERNAME}", "--password=${DB_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    dbdata:
        driver: local
